[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sociallearningclaw"
version = "0.1.0"
description = "Schema-learning agents evaluated on ARC-AGI-3, ContextMATH, and IntPhys2"
requires-python = ">=3.12"
dependencies = [
  "arc-agi==0.9.9",
  "arcengine==0.9.3",
  "httpx>=0.27.0",
  "huggingface_hub>=0.23.0",
  "sentence-transformers>=3.0.0",
  "rich>=13.0.0",
  "jinja2==3.1.6",
  "numpy==2.4.6",
  "openai>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "pandas>=2.2.0",
  "pillow==12.3.0",
  "pyarrow>=17.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml==6.0.3",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
sc-run-static = "socialclaw.run_static:main"
sc-run-arc = "socialclaw.run_arc:main"
sc-run-arc-v2 = "socialclaw.run_arc_v2:main"
sc-run-arc-v3 = "socialclaw.run_arc_v3:main"
tycho-run = "tycho.harness.run_parallel:main"
tycho-submission-replay = "tycho.harness.submission_replay:main"
tycho-viewer = "tycho.viewer.serve:main"
tycho-sandbox = "tycho.workspace.sandbox:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["socialclaw*", "tycho*"]

[tool.setuptools.package-data]
tycho = [
  "prompts/*.j2",
  "prompts/partials/*.j2",
  "workspace/templates/*.tmpl",
  "workspace/container/Containerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests", "third_party/tycho/tests"]
norecursedirs = [".venv", "build", "outputs", "results"]
