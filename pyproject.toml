[project]
name = "sociallearningclaw"
version = "0.0.1"
description = "Proactive social-evolve agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "huggingface_hub>=0.23.0",
  "sentence-transformers>=3.0.0",
  "rich>=13.0.0",
  "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["socialclaw*"]
